<style>
:root{--bg:#e9e9ea;--panel:#fff;--soft:#f7f7f8;--line:#ececee;--text:#1a1a1f;--muted:#6b6b76;--primary:#4b2bd6;--ps:#efeafe;--green:#2f9e44;--gb:#e6f6e9;--yellow:#a76a14;--yb:#fff6dc;--red:#c92a2a;--rb:#fdeaea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;min-height:100vh;max-width:1440px;margin:0 auto;background:var(--soft)}
.side{width:240px;background:var(--panel);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto;flex:none;z-index:30}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:14px}
.logo b{width:34px;height:34px;border-radius:9px;background:#111;color:#fff;display:grid;place-items:center}
.grp{font-size:11px;letter-spacing:.06em;color:var(--muted);margin:12px 6px 4px;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:10px;padding:10px;border-radius:9px;border:0;background:none;width:100%;text-align:left;color:#33333a}
.nav:hover{background:var(--soft)}.nav.on{background:var(--ps);color:var(--primary);font-weight:600}
.me{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.me select{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;width:100%}
.me small{color:var(--muted);display:block;margin-bottom:6px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 28px;background:var(--panel);border-bottom:1px solid var(--line);justify-content:space-between}
.burger{display:none}
.ib{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;position:relative;display:grid;place-items:center;min-width:36px;min-height:36px}
.dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.content{padding:24px 28px 40px;display:flex;flex-direction:column;gap:16px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.head h1{font-size:22px;font-weight:600;margin-right:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 14px;font-weight:500;min-height:40px}
.btn:hover{background:var(--soft)}.btn.p{background:var(--primary);border-color:var(--primary);color:#fff}.btn.sm{padding:6px 10px;min-height:32px}
.card{background:var(--panel);border-radius:14px;border:1px solid var(--line)}
.sum{display:flex}.sum>div{padding:18px 22px}.sum .l{border-right:1px solid var(--line);min-width:220px}
small{color:var(--muted)}.big{font-size:24px;font-weight:700}
.bar{display:flex;gap:4px;height:6px;margin:10px 0 8px;max-width:420px}.bar i{border-radius:4px;display:block}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.leg b{color:var(--text)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi{padding:16px 18px}.kpi .big{margin:6px 0 2px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}.pad{padding:18px 20px}.pad h3{font-size:15px;margin-bottom:10px}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.li:first-of-type{border-top:0}.li .n{flex:1;min-width:0;overflow-wrap:anywhere}.li small{display:block}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.b-in{background:var(--gb);color:var(--green)}.b-low{background:var(--yb);color:var(--yellow)}.b-out{background:var(--rb);color:var(--red)}
.hbar{height:8px;border-radius:5px;background:var(--primary);min-width:3px}.hrow{display:grid;grid-template-columns:130px 1fr 36px;align-items:center;gap:10px;padding:6px 0;font-size:13px}
.tools{display:flex;gap:10px;padding:16px 20px;flex-wrap:wrap;align-items:center}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;flex:1;min-width:160px;max-width:300px}
.search input{border:0;outline:0;background:none;width:100%}
select,.fi{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;min-height:40px}
.fi{width:100%;margin-top:6px}label.f{display:block;margin-top:12px;color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse}th{background:var(--soft);text-align:left;font-weight:500;color:#44444c;padding:12px 14px;font-size:13px;white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}.tw{padding:0 20px 8px;overflow-x:auto}
.nm{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.th{width:34px;height:34px;border-radius:8px;background:var(--ps);display:grid;place-items:center;font-size:17px;flex:none}
.pg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;flex-wrap:wrap}.pgs{display:flex;gap:6px}
.pgs button{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:36px;height:36px;padding:0 10px}.pgs button.on{border-color:var(--primary);color:var(--primary);font-weight:600}.pgs button:disabled{opacity:.4}
.neg{color:var(--red);font-weight:600}.empty{color:var(--muted);text-align:center;padding:26px 0}
.pos{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.cats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px}.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.mi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;min-height:110px}
.mi:hover{border-color:var(--primary)}.mi:active{transform:scale(.98)}.mi .e{font-size:30px}.mi .pr{color:var(--primary);font-weight:700}
.mi .w{position:absolute;top:10px;right:10px;font-size:11px;background:var(--yb);color:var(--yellow);border-radius:999px;padding:2px 8px}
.cart{position:sticky;top:16px;display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.cart h3{padding:16px 18px;border-bottom:1px solid var(--line);font-size:15px;display:flex;justify-content:space-between}
.cl{padding:6px 18px;overflow:auto;flex:1;min-height:90px}.cr{padding:12px 0;border-top:1px solid var(--line)}.cr:first-child{border-top:0}
.cr .t{display:flex;justify-content:space-between;font-weight:500}.cr .o{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;min-height:32px}.mini.on{background:var(--ps);border-color:var(--primary);color:var(--primary)}
.qty{display:flex;align-items:center;gap:8px;margin-left:auto}.qty button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px}
.tot{padding:14px 18px;border-top:1px solid var(--line);background:var(--soft);border-radius:0 0 14px 14px}
.tot>div{display:flex;justify-content:space-between;padding:2px 0;color:#44444c;align-items:center}.tot .g{font-size:18px;font-weight:700;color:var(--text);padding-top:8px}.tot .btn{width:100%;margin-top:10px;padding:12px}
.cartbar{display:none}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.rc h3{display:flex;justify-content:space-between;gap:8px;align-items:center}.rc td{padding:6px 0;border:0;font-size:13px}
.rc .ft{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-size:13px}.mg{color:var(--green);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(15,15,25,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}.ov.on{display:flex}
.md{background:#fff;border-radius:16px;width:min(460px,100%);max-height:92vh;overflow:auto;padding:22px}
.md h2{font-size:18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}.md h2 button{border:0;background:none;font-size:24px;color:var(--muted)}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}.pm button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 6px}.pm button.on{border-color:var(--primary);background:var(--ps);color:var(--primary);font-weight:600}
.qk{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.rcp{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--soft);border-radius:10px;padding:14px;margin-bottom:12px}.rcp div{display:flex;justify-content:space-between;gap:10px}.rcp hr{border:0;border-top:1px dashed #bbb;margin:8px 0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 10px;font-size:13.5px}.kv span:nth-child(odd){color:var(--muted)}
.pr2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.pr2 select{grid-column:1/-1}
.form{padding:18px 20px;max-width:520px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#1a1a1f;color:#fff;padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw;text-align:center}#toast.on{opacity:1;transform:translateX(-50%)}
.bn,.scrim{display:none}
.rp-chart{width:100%;height:auto;display:block}.rp-chart .b{fill:var(--primary);opacity:.35}.rp-chart .b.pk{opacity:1}.rp-chart text{font-size:11px;fill:var(--muted)}
.delta{font-size:12px;font-weight:600}.delta.up{color:var(--green)}.delta.dn{color:var(--red)}
.hb2{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;align-items:center;gap:10px;padding:6px 0;font-size:13px}
.det summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between}.det summary::-webkit-details-marker{display:none}.det summary::after{content:"▾";color:var(--muted)}.det[open] summary::after{content:"▴"}
.hbar.r{background:var(--red)}.hbar.y{background:#e0b83a}.hbar.g{background:var(--green)}
@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.pos{grid-template-columns:1fr 320px}}
@media(max-width:1023px) and (min-width:768px){.side{width:68px;padding:16px 10px;align-items:center}.lbl,.grp,.logo span,.me small,.me select{display:none}.nav{justify-content:center}}
@media(max-width:767px){
.side{position:fixed;left:0;top:0;bottom:0;width:250px;transform:translateX(-100%);transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.2)}.side.open{transform:none}
.scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}.burger{display:grid}
.top{padding:10px 14px}.content{padding:16px 14px 150px}.head h1{font-size:19px;width:100%}
.sum{flex-direction:column}.sum .l{border-right:0;border-bottom:1px solid var(--line)}.grid4{gap:10px}.kpi{padding:14px}.big{font-size:20px}
.pos{grid-template-columns:1fr}.menu{grid-template-columns:repeat(2,1fr)}
.cart{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:80vh;border-radius:18px 18px 0 0;transform:translateY(110%);transition:.25s;z-index:60;box-shadow:0 -10px 40px rgba(0,0,0,.2)}.cart.open{transform:none}
.cartbar{display:flex;position:fixed;left:14px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--primary);color:#fff;border:0;border-radius:14px;padding:14px 16px;justify-content:space-between;font-weight:600;z-index:40}
.bn{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:50;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bn button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 0;min-height:44px}.bn button.on{color:var(--primary);font-weight:600}
.search{max-width:none;flex:1 1 100%}.tw{padding:0 14px}
table.rt thead{display:none}table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
table.rt tr{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px}
table.rt td{border:0;padding:5px 0;display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:right}table.rt td:before{content:attr(data-l);color:var(--muted);font-size:12px;text-align:left}
.kv{grid-template-columns:110px 1fr}}

/* ---------- dashboard ---------- */

 const O=todayOrders(),sales=O.reduce((a,o)=>a+o.tot,0),cnt={};O.forEach(o=>o.lines.forEach(l=>cnt[l.id]=(cnt[l.id]||0)+l.q));
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=top[0]?top[0][1]:1;
 return `<div class="head"><h1>Dashboard</h1><button class="btn p" onclick="go('pos')">${ic('pos')}<span>Buka Kasir</span></button></div>
 <div class="grid4"><div class="card kpi"><small>Penjualan hari ini</small><div class="big">${rp(sales)}</div><small>${O.length} pesanan</small></div>
 <div class="card kpi"><small>Nilai total stok</small><div class="big">${rp(stockVal())}</div><small>${A.length} bahan aktif</small></div>
 <div class="card kpi"><small>Bahan menipis / habis</small><div class="big" style="color:${c.low+c.out?'var(--red)':'inherit'}">${c.low+c.out}</div><small>${c.low} low · ${c.out} habis</small></div>
 <div class="card kpi"><small>Mendekati kedaluwarsa</small><div class="big">${exp.length}</div><small>batch, dalam 14 hari</small></div></div>

 <div class="two"><div class="card pad"><h3>Perlu dipesan / diperiksa</h3>${low.map(i=>{const d=Math.floor(Math.max(0,stock(i))/dUse(i)),s=STX[status(i)];return `<div class="li"><div class="th">${i.e}</div><div class="n"><b>${esc(i.n)}</b><small>${stock(i)<0?'<span class="neg">Stok minus – periksa</span>':stock(i)<=0?'Habis':'Sisa ±'+d+' hari'} · par ${nf(i.par)} ${i.u}</small></div><span class="badge ${s[0]}">${s[1]}</span></div>`}).join('')||'<div class="empty">Semua stok aman 🎉</div>'}</div>
  <div class="card pad"><h3 style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>🔔 Rekomendasi pemesanan</span><button class="btn sm" onclick="poDraft()">Buat PO</button></h3>${A.filter(i=>{const e=calcEOQ(i);return e.needOrder}).slice(0,5).map(i=>{const e=calcEOQ(i);return `<div class="li"><div class="th">${i.e}</div><div class="n"><b>${esc(i.n)}</b><small>Stok: ${nf(stock(i))} ${i.u} · ROP: ${nf(e.rop)} ${i.u} · Sisa ±${nf(e.daysLeft)} hari</small></div><span class="badge b-out">Pesan ${e.eoq} ${esc(i.buy)}</span></div>`}).join('')||'<div class="empty">Semua stok di atas ROP 🎉</div>'}</div>
 <div style="display:flex;flex-direction:column;gap:14px"><div class="card pad"><h3>Kedaluwarsa terdekat</h3>${exp.map(b=>{const d=daysTo(b.exp),i=I(b.ing);return `<div class="li"><div class="th">${i.e}</div><div class="n"><b>${esc(i.n)}</b><small>${fd(b.exp)} · sisa ${nf(b.rem)} ${i.u}</small></div><span class="badge ${d<=3?'b-out':'b-low'}">${d<0?'Lewat':d===0?'Hari ini':'H-'+d}</span></div>`}).join('')||'<div class="empty">Tidak ada</div>'}</div>
 <div class="card pad"><h3>Menu terlaris hari ini</h3>${top.map(([id,n])=>`<div class="hrow"><span>${esc(M(id).e)} ${esc(M(id).n)}</span><div class="hbar" style="width:${n/mx*100}%"></div><b>${n}</b></div>`).join('')||'<div class="empty">Belum ada penjualan</div>'}</div></div></div>`}
const barLeg=c=>`<div class="bar"><i style="flex:${c.in||.01};background:var(--green)"></i><i style="flex:${c.low||.01};background:#e0b83a"></i><i style="flex:${c.out||.01};background:var(--red)"></i></div><div class="leg"><span>In stock: <b>${c.in}</b></span><span>Low stock: <b>${c.low}</b></span><span>Out of stock: <b>${c.out}</b></span></div>`;

/* ---------- inventory ---------- */
function pageInv(){
 const c=counts(),cats=['Semua',...new Set(act().map(i=>i.c))],can=true;
 return `<div class="head"><h1>Inventory</h1>${can?`<button class="btn p" onclick="ingModal()">${ic('plus')}<span>Tambah Bahan</span></button>`:''}</div>
 <div class="card sum"><div class="l"><small>Total Nilai Stok</small><div class="big">${rp(stockVal())}</div></div><div style="flex:1"><b>${act().length} Bahan</b>${barLeg(c)}</div></div>
 <div class="card"><div class="tools"><label class="search">${ic('search')}<input placeholder="Cari nama / SKU" value="${esc(S.invQ)}" oninput="S.invQ=this.value;S.invPg=1;invTable()"></label><div style="flex:1"></div>
 <select onchange="S.invCat=this.value;S.invPg=1;invTable()">${cats.map(x=>`<option ${x===S.invCat?'selected':''}>${esc(x)}</option>`).join('')}</select>
 <select onchange="S.invSt=this.value;S.invPg=1;invTable()"><option value="Semua">Semua status</option>${['in','low','out'].map(k=>`<option value="${k}" ${S.invSt===k?'selected':''}>${STX[k][1]}</option>`).join('')}</select></div><div id="invt"></div></div>`}
function invTable(){
 const q=S.invQ.toLowerCase(),rows=act().filter(i=>(S.invCat==='Semua'||i.c===S.invCat)&&(S.invSt==='Semua'||status(i)===S.invSt)&&(!q||(i.n+i.sku).toLowerCase().includes(q)));

 $('#invt').innerHTML=tb(['Nama Bahan','Kategori','SKU','Incoming','Stok','Par level','Harga rata-rata','Status'],v.map(i=>{const s=STX[status(i)],n=incoming(i);return [`<div class="nm" onclick="itemModal('${i.id}')"><div class="th">${i.e}</div>${esc(i.n)}</div>`,esc(i.c),esc(i.sku),n?nf(n)+' '+i.u:'–',fmtQ(i),nf(i.par)+' '+i.u,rp(avg(i))+'/'+i.u,`<span class="badge ${s[0]}">${s[1]}</span>`]}))+
 `<div class="pg"><span>Hasil ${rows.length?a+1:0}-${Math.min(a+PER,rows.length)} dari ${rows.length}</span><div class="pgs"><button ${S.invPg<=1?'disabled':''} onclick="S.invPg--;invTable()">←</button>${Array.from({length:pages},(_,k)=>`<button class="${k+1===S.invPg?'on':''}" onclick="S.invPg=${k+1};invTable()">${k+1}</button>`).join('')}<button ${S.invPg>=pages?'disabled':''} onclick="S.invPg++;invTable()">→</button></div></div>`}
function itemModal(id){
 const i=I(id),s=STX[status(i)],bs=DB.bat.filter(b=>b.ing===id&&b.rem>0),ms=DB.mov.filter(m=>m.ing===id).slice(0,8),e=calcEOQ(i),d=Math.max(0,Math.floor(stock(i)/(e.dm||i.use||1)));
 modal(`<h2>${i.e} ${esc(i.n)}<button onclick="closeModal()">×</button></h2><div class="kv"><span>Status</span><span><span class="badge ${s[0]}">${s[1]}</span></span><span>Stok sekarang</span><span>${fmtQ(i)}</span><span>Par / minimum</span><span>${nf(i.par)} / ${nf(i.min)} ${i.u}</span>
 <span>Estimasi sisa</span><span>${stock(i)<=0?'Habis':'±'+d+' hari'} (pakai ±${nf(e.dm)} ${i.u}/hari)</span><span>Satuan beli</span><span>${esc(i.buy)} = ${nf(i.conv)} ${i.u}</span><span>Harga rata-rata</span><span>${rp(avg(i))} / ${i.u}</span><span>Supplier</span><span>${esc(i.sup)}</span></div>
 <h3 style="margin:16px 0 6px;font-size:14px">Batch (FEFO)</h3>${bs.map(b=>`<div class="li"><div class="n"><b>${nf(b.rem)} ${i.u}</b><small>Terima ${fd(b.date)} · ${rp(b.cost)}/${i.u}</small></div><span class="badge ${!b.exp?'b-in':daysTo(b.exp)<0?'b-out':daysTo(b.exp)<=3?'b-low':'b-in'}">${b.exp?fd(b.exp):'Tanpa exp'}</span></div>`).join('')||'<small>Tidak ada batch</small>'}
  <h3 style="margin:16px 0 6px;font-size:14px">📊 Analisis EOQ</h3><div class="kv"><span>Pemakaian rata-rata</span><span>${nf(e.dm)} ${i.u}/hari (±${nf(e.sd)})</span><span>Lead time</span><span>${e.L} hari</span><span>Safety stock</span><span>${nf(e.ss)} ${i.u}</span><span>Reorder Point (ROP)</span><span>${nf(e.rop)} ${i.u}</span><span>Saran jumlah pesan</span><b style="color:var(--primary)">${e.eoq} ${esc(i.buy)}</b><span>Umur simpan (hari)</span><span><input class="fi" type="number" inputmode="numeric" style="margin:0;width:90px;min-height:32px;padding:4px 8px" value="${i.shelf||''}" placeholder="otomatis" onchange="I('${id}').shelf=+this.value||0;save()"></span><span>Status</span><span>${e.needOrder?'<span class="badge b-out">Pesan sekarang</span>':'<span class="badge b-in">Aman</span>'}</span></div>
 <h3 style="margin:16px 0 6px;font-size:14px">Riwayat mutasi</h3>${ms.map(m=>`<div class="li"><div class="n"><b>${m.type}</b> <small style="display:inline">${esc(m.note)} · ${new Date(m.ts).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'})}</small></div><b class="${m.q<0?'neg':'mg'}" style="color:${m.q<0?'':'var(--green)'}">${m.q>0?'+':''}${nf(m.q)}</b></div>`).join('')||'<small>Belum ada</small>'}
 ${S.role!=='Kasir'?`<div style="display:flex;gap:8px;margin-top:16px"><button class="btn" style="flex:1" onclick="closeModal();go('wst')">Catat waste</button><button class="btn" style="flex:1" onclick="toggleIng('${id}')">Nonaktifkan</button></div>`:''}`)}
function toggleIng(id){I(id).act=false;save();closeModal();render();toast('Bahan dinonaktifkan')}
function ingModal(){
 modal(`<h2>Tambah Bahan<button onclick="closeModal()">×</button></h2><label class="f">Nama<input class="fi" id="a_n"></label><label class="f">Kategori<input class="fi" id="a_c" list="cl" placeholder="Kopi, Bubuk…"><datalist id="cl">${[...new Set(DB.ing.map(i=>i.c))].map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></label>
 <label class="f">SKU<input class="fi" id="a_s"></label><label class="f">Satuan pakai (g, ml, pcs)<input class="fi" id="a_u" value="g"></label><label class="f">Satuan beli (contoh: kantong 1 kg)<input class="fi" id="a_b"></label><label class="f">Faktor konversi (1 satuan beli = … satuan pakai)<input class="fi" id="a_k" type="number" value="1000"></label>
 <label class="f">Par level<input class="fi" id="a_p" type="number"></label><label class="f">Batas minimum<input class="fi" id="a_m" type="number"></label><label class="f">Supplier<select class="fi" id="a_sp">${opts(DB.sup.map(s=>[s.n,s.n]))}</select></label>
 <label class="f">Stok awal (satuan pakai, boleh kosong)<input class="fi" id="a_q" type="number"></label><label class="f">Harga per satuan pakai<input class="fi" id="a_h" type="number"></label><label class="f">Kedaluwarsa stok awal<input class="fi" id="a_e" type="date"></label><label class="f">Umur simpan (hari, boleh kosong)<input class="fi" id="a_sl" type="number" inputmode="numeric"></label>
 <button class="btn p" style="width:100%;margin-top:16px" onclick="saveIng()">Simpan</button>`)}
function saveIng(){
 const v=k=>$('#a_'+k).value.trim();if(!v('n'))return toast('Nama wajib diisi');
 const i={id:'i'+Date.now(),n:v('n'),e:'📦',c:v('c')||'Lainnya',sku:v('s')||'-',u:v('u').replace(/[<>&"'`]/g,'')||'g',buy:v('b')||'satuan',conv:+v('k')||1,par:+v('p')||0,min:+v('m')||0,cost:+v('h')||0,sup:v('sp'),use:1,shelf:+v('sl')||0,act:true,neg:0};

/* ---------- kasir ---------- */
const cartCalc=()=>{const sub=S.cart.reduce((a,l)=>a+unit(l)*l.q,0),d=Math.min(S.disc||0,sub),tot=sub-d;return {sub,d,tot,...split(tot),n:S.cart.reduce((a,l)=>a+l.q,0)}};
const missing=m=>m.r.some(([id,q])=>stock(I(id))<q);
function pagePos(){
 const cats=['Semua',...new Set(DB.menu.map(m=>m.cat))],sh=DB.shift;
 return `<div class="head"><h1>Kasir</h1>${sh?`<span class="badge b-in">Shift dibuka ${new Date(sh.ts).toTimeString().slice(0,5)}</span><button class="btn sm" onclick="closeShiftModal()">Tutup shift</button>`:`<button class="btn p" onclick="openShiftModal()">Buka shift</button>`}</div>
 <div class="pos"><div><div class="cats">${cats.map(c=>`<button class="chip ${S.cat===c?'on':''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}<label class="search" style="margin-left:auto">${ic('search')}<input placeholder="Cari menu" value="${esc(S.mq)}" oninput="S.mq=this.value;menuGrid()"></label></div><div class="menu" id="menug"></div></div><aside class="card cart" id="cart"></aside></div><button class="cartbar" id="cartbar" onclick="$('#cart').classList.add('open')"></button>`}
function menuGrid(){const q=S.mq.toLowerCase();$('#menug').innerHTML=DB.menu.filter(m=>(S.cat==='Semua'||m.cat===S.cat)&&m.n.toLowerCase().includes(q)).map(m=>`<button class="mi" onclick="addCart('${m.id}')">${missing(m)?'<span class="w">Bahan kurang</span>':''}<span class="e">${esc(m.e)}</span><b>${esc(m.n)}</b><span class="pr">${rp(m.price)}</span></button>`).join('')||'<div class="empty">Menu tidak ditemukan</div>'}
function renderCart(){
 const c=cartCalc(),el=$('#cart');if(!el)return;
 el.innerHTML=`<h3><span>Pesanan #${DB.no}</span><span style="color:var(--muted);font-weight:400;cursor:pointer;padding:4px" onclick="${S.cart.length?'S.cart=[];S.disc=0;renderCart()':"$('#cart').classList.remove('open')"}">${S.cart.length?'Kosongkan':'Tutup'}</span></h3>
 <div class="cl">${S.cart.map((l,k)=>{const m=M(l.id);return `<div class="cr"><div class="t"><span>${esc(m.e)} ${esc(m.n)}</span><span>${rp(unit(l)*l.q)}</span></div>${m.cat!=='Lainnya'?`<div class="o">${['Ice','Hot'].map(t=>`<button class="mini ${l.t===t?'on':''}" onclick="S.cart[${k}].t='${t}';renderCart()">${t}</button>`).join('')}<span style="width:6px"></span>${Object.keys(SIZES).map(z=>`<button class="mini ${l.sz===z?'on':''}" onclick="S.cart[${k}].sz='${z}';renderCart()">${z}${SIZES[z]?' +'+SIZES[z]/1000+'rb':''}</button>`).join('')}</div>`:''}<input class="fi" style="margin-top:8px;min-height:34px;padding:4px 10px" placeholder="Catatan (less ice, dll)" value="${esc(l.note||'')}" oninput="S.cart[${k}].note=this.value"><div class="o">${m.cat==='Kopi'?`<button class="mini ${l.sh?'on':''}" onclick="S.cart[${k}].sh=${l.sh?0:1};renderCart()">+ Extra shot ${SHOT/1000}rb</button>`:''}<div class="qty"><button onclick="qty(${k},-1)">−</button><b>${l.q}</b><button onclick="qty(${k},1)">+</button></div></div></div>`}).join('')||'<div class="empty">Pilih menu untuk mulai pesanan</div>'}</div>
 <div class="tot"><div><span>Subtotal</span><span>${rp(c.sub)}</span></div><div><span>Diskon (Rp)</span><input type="number" class="fi" style="width:110px;margin:0;min-height:34px;padding:4px 8px;text-align:right" value="${S.disc||''}" placeholder="0" onchange="S.disc=+this.value||0;renderCart()"></div>
 <div class="g"><span>Total</span><span>${rp(c.tot)}</span></div><small style="display:block;text-align:right;margin-top:2px">Sudah termasuk service ${DB.set.service}% (${rp(c.sv)}) &amp; PB1 ${DB.set.pb1}% (${rp(c.tx)})</small>
 <button class="btn p" ${c.n?'':'disabled style="opacity:.5"'} onclick="payModal()">Bayar ${c.n?rp(c.tot):''}</button></div>`;
 const b=$('#cartbar');if(b){b.innerHTML=c.n?`<span>${c.n} item</span><span>Lihat keranjang · ${rp(c.tot)}</span>`:'';b.style.display=c.n?'':'none'}}
function addCart(id){const t=M(id).cat==='Lainnya'?undefined:'Ice',l=S.cart.find(x=>x.id===id&&x.t===t&&x.sz==='Regular'&&!x.sh&&!x.note);l?l.q++:S.cart.push({id,q:1,t,sz:'Regular',sh:0,note:''});renderCart()}
function qty(k,d){S.cart[k].q+=d;if(S.cart[k].q<=0)S.cart.splice(k,1);if(!S.cart.length)S.disc=0;renderCart()}
function openShiftModal(){modal(`<h2>Buka shift<button onclick="closeModal()">×</button></h2><label class="f">Modal awal kas (Rp)<input class="fi" id="sh_m" type="number" inputmode="numeric" placeholder="0"></label><button class="btn p" style="width:100%;margin-top:16px" onclick="DB.shift={ts:Date.now(),modal:+$('#sh_m').value||0,by:S.user.n};save();closeModal();render();toast('Shift dibuka')">Buka shift</button>`)}
const shiftCash=()=>DB.ord.filter(o=>o.ts>=DB.shift.ts&&o.status==='Lunas'&&o.pay==='Tunai').reduce((a,o)=>a+o.tot,0);
function closeShiftModal(){const s=DB.shift,cash=shiftCash(),n=DB.ord.filter(o=>o.ts>=s.ts).length;
 modal(`<h2>Tutup shift<button onclick="closeModal()">×</button></h2><div class="kv"><span>Pesanan</span><span>${n}</span><span>Modal awal</span><span>${rp(s.modal)}</span><span>Penjualan tunai</span><span>${rp(cash)}</span><span>Kas diharapkan</span><b>${rp(s.modal+cash)}</b></div>
 <label class="f">Kas dihitung (Rp)<input class="fi" id="sh_c" type="number" inputmode="numeric" oninput="$('#sh_d').textContent=rp((+this.value||0)-${s.modal+cash})"></label><div style="margin-top:10px">Selisih: <b id="sh_d">–</b></div><button class="btn p" style="width:100%;margin-top:16px" onclick="closeShift()">Tutup shift</button>`)}

 if(!DB.shift){openShiftModal();return toast('Buka shift dulu')}
 const c=cartCalc();S.pay='Tunai';S.cash=0;
 modal(`<h2>Pembayaran<button onclick="closeModal()">×</button></h2><div class="big" style="text-align:center">${rp(c.tot)}</div><div class="pm">${['Tunai','QRIS','Debit/Kredit'].map(p=>`<button class="${p==='Tunai'?'on':''}" onclick="setPay('${p}',this)">${p}</button>`).join('')}</div>

 <div id="qrbox" style="display:none;text-align:center;color:var(--muted);padding:10px 0"></div><button class="btn p" style="width:100%;margin-top:16px;padding:13px" onclick="doPay()">Selesaikan pembayaran</button>`)}

function cashCalc(){const c=cartCalc(),v=+$('#cash').value||0;S.cash=v;$('#chg').textContent=v>=c.tot?rp(v-c.tot):'Kurang '+rp(c.tot-v)}
function copyRcp(){const ok=()=>toast('Struk disalin'),no=()=>toast('Gagal menyalin');try{navigator.clipboard.writeText(window._rcp).then(ok,no)}catch(e){no()}}
function doPay(){
 const c=cartCalc();if(S.pay==='Tunai'&&S.cash<c.tot)return toast('Uang diterima kurang');

 ${kpi('Food cost',a.dpp?fc.toFixed(1)+'%':'–',rp(a.cogs)+' bahan terpakai',fcs?`<span class="badge ${fcs[0]}">${fcs[1]}</span> <small>target ≤ 35%</small>`:'<small>Belum ada penjualan</small>')}
 ${kpi('Laba kotor',rp(laba),'margin '+(a.dpp?(laba/a.dpp*100).toFixed(0):0)+'% dari penjualan bersih',delta(laba,labaP))}
 ${kpi('Waste',rp(w.t),(a.cogs?(w.t/a.cogs*100).toFixed(1):'0')+'% dari pemakaian bahan',delta(w.t,wp.t,true))}</div>
 <div class="card pad"><h3>${hourly?'Penjualan per jam':'Penjualan per hari'}</h3>${a.n?svg()+`<small style="display:block;margin-top:6px">${hourly?'Jam tersibuk':'Hari terbaik'}: <b style="color:var(--text)">${esc(pkb.t)}</b> · ${rp(pkb.v)} (${pkb.n} pesanan)</small>`:'<div class="empty">Belum ada penjualan pada periode ini</div>'}</div>
 <div class="two"><div class="card pad"><h3>Menu terlaris</h3>${menus.length?`<small style="display:block;margin-bottom:4px">Jumlah terjual · margin bahan (hijau ≥ 65%, kuning ≥ 50%)</small>`+menus.slice(0,8).map(([id,x])=>{const m=mgn(x),c=m>=65?'b-in':m>=50?'b-low':'b-out';return `<div class="hb2"><span>${mName(id)}</span><div class="hbar" style="width:${x.q/topq*100}%"></div><span><b>${x.q}</b> <span class="badge ${c}">${m.toFixed(0)}%</span></span></div>`}).join(''):'<div class="empty">Belum ada penjualan</div>'}</div>
 <div class="card pad"><h3>Metode pembayaran</h3>${a.tot?`<div class="bar" style="max-width:none;height:10px">${pays.map(p=>`<i style="flex:${a.pay[p[0]]||0};background:${p[1]}"></i>`).join('')}</div>`+pays.map(p=>`<div class="li"><span style="width:10px;height:10px;border-radius:50%;background:${p[1]};flex:none"></span><div class="n">${p[0]}</div><b>${rp(a.pay[p[0]]||0)}</b><small style="width:42px;text-align:right">${(((a.pay[p[0]]||0)/a.tot)*100).toFixed(0)}%</small></div>`).join(''):'<div class="empty">Belum ada penjualan</div>'}</div></div>
 <div class="card pad"><h3>Perlu perhatian</h3>${al.map(x=>`<div class="li"><span class="badge ${x[0]==='out'?'b-out':'b-low'}">${x[0]==='out'?'Penting':'Cek'}</span><div class="n">${x[1]}</div>${x[2]?`<button class="btn sm" onclick="go('${x[2]}')">Lihat</button>`:''}</div>`).join('')||'<div class="empty">Semua aman 🎉</div>'}</div>
 <details class="card pad det" ${S.repOpen?'open':''} ontoggle="S.repOpen=this.open"><summary>Detail lengkap</summary>
 <h3 style="margin-top:14px">Penjualan per menu</h3>${tb(['Menu','Terjual','Omzet','Food cost','Margin'],menus.map(([id,x])=>[mName(id),x.q,rp(x.r),rp(x.c),mgn(x).toFixed(0)+'%']))}
 <h3 style="margin-top:14px">Pemakaian bahan (dari penjualan)</h3>${tb(['Bahan','Dipakai','Nilai'],useRows.map(([id,q,v])=>[esc(I(id).n),nf(q)+' '+esc(I(id).u),rp(v)]))}
 <h3 style="margin-top:14px">Waste per alasan</h3>${tb(['Alasan','Nilai'],Object.entries(w.r).map(([r,v])=>[esc(r),rp(v)]))}
 <h3 style="margin-top:14px">Selisih opname</h3>${tb(['Bahan','Selisih','Status'],DB.st.filter(s=>inR(s.ts,from,to)).map(s=>[esc(I(s.ing).n),nf(s.phys-s.sys)+' '+esc(I(s.ing).u),s.st]))}</details>`}
function setSL(c,v){const s=DB.set.sl=DB.set.sl||{...SLD};s[c]=+v;save();render()}
function pageAna(){
 const AN=analyze(),{R,list,exp,days,N,fw,dowOK,O,turn,sv}=AN,cv=r=>isFinite(r.cover)?r.cover:1e9;
 const pill={now:['b-out','Pesan sekarang'],soon:['b-low','Segera'],ok:['b-in','Aman']},cls={now:'r',soon:'y',ok:'g'};
 const nNow=list.filter(r=>r.status==='now').length,nSoon=list.filter(r=>r.status==='soon').length,expVal=exp.reduce((a,x)=>a+x.val,0);
 const dtxt=r=>r.dm>0?(r.cover>=30?'> 30 hari':nf(r.cover)+' hari'):'–';
 const warn=r=>(r.capped||r.warn)?`<small style="display:block;color:var(--yellow)">Dibatasi umur simpan ±${r.shelf} hari${r.warn?` · 1 ${esc(r.i.buy)} tetap melebihi pemakaian sebelum kedaluwarsa, pertimbangkan kemasan lebih kecil`:''}</small>`:'';
 const mName=id=>M(id)?esc(M(id).e)+' '+esc(M(id).n):esc(id);
 const kpi=(t,big,sub)=>`<div class="card kpi"><small>${t}</small><div class="big">${big}</div><small style="display:block">${sub}</small></div>`;
 const sel=(v,o,fn)=>`<select onchange="${fn}">${o.map(x=>`<option value="${x[0]}" ${String(v)===String(x[0])?'selected':''}>${x[1]}</option>`).join('')}</select>`;
 /* menu engineering */
 const mn=Object.entries(AN.mn).filter(([id,x])=>M(id)&&x.q>0).map(([id,x])=>({id,q:x.q,cm:x.r/x.q/fac()-x.c/x.q})),tq=mn.reduce((a,m)=>a+m.q,0),aCM=tq?mn.reduce((a,m)=>a+m.cm*m.q,0)/tq:0,popT=.7/(mn.length||1);
 const quad=[['⭐ Bintang','Laris & margin tinggi','Pertahankan kualitas, jadikan andalan promosi.',m=>m.q/tq>=popT&&m.cm>=aCM],['🐴 Kuda kerja','Laris tapi margin tipis','Naikkan harga sedikit atau hemat bahan termahal di resep.',m=>m.q/tq>=popT&&m.cm<aCM],['🧩 Puzzle','Margin tinggi tapi kurang laris','Tonjolkan di kasir, tawarkan sebagai rekomendasi.',m=>m.q/tq<popT&&m.cm>=aCM],['🔍 Perlu ditinjau','Kurang laris & margin tipis','Perbaiki resep/harga, atau pertimbangkan dihapus dari menu.',m=>m.q/tq<popT&&m.cm<aCM]];
 const DN=['Min','Sen','Sel','Rab','Kam','Jum','Sab'],fmx=Math.max(...fw);
 return `<div class="head"><h1>Analisis TI</h1>${sel(N,[[7,'Data 7 hari'],[30,'Data 30 hari'],[60,'Data 60 hari']],"DB.set.anaN=+this.value;save();render()")}<button class="btn p" onclick="poDraft()">${ic('truck')}<span>Buat PO dari rekomendasi</span></button></div>
 ${O.length?'':'<div class="card pad"><small>Belum ada penjualan pada periode ini: pemakaian memakai estimasi awal per bahan (ditandai *).</small></div>'}${O.length&&days<14?`<div class="card pad"><small>Data penjualan baru ${days} hari. Rekomendasi makin akurat setelah ≥ 14 hari (pola per hari butuh ≥ 14 hari).</small></div>`:''}
 <div class="grid4">${kpi('Perlu dipesan',nNow+' bahan',nSoon+' lagi mendekati batas pesan')}${kpi('Risiko kedaluwarsa',rp(expVal),exp.length+' batch diperkirakan tidak habis')}${kpi('Perputaran stok',nf(turn)+'×','per tahun (diannualisasi)')}${kpi('Hari persediaan',turn>0?nf(365/turn)+' hari':'–','nilai stok '+rp(sv))}</div>
 <div class="two"><div class="card pad"><h3>Rekomendasi pemesanan</h3>${list.filter(r=>r.status!=='ok').map(r=>`<div class="li"><div class="th">${r.i.e}</div><div class="n"><b>${esc(r.i.n)}${r.est?' *':''}</b><small>Stok ${nf(r.s)} ${esc(r.i.u)}${r.inc?' + incoming '+nf(r.inc):''} · habis ±${dtxt(r)} · lead time ${r.L} hari</small>${warn(r)}</div><div style="text-align:right"><span class="badge ${pill[r.status][0]}">${pill[r.status][1]}</span><small style="display:block;margin-top:4px">Pesan ${r.q} ${esc(r.i.buy)}</small></div></div>`).join('')||'<div class="empty">Semua stok aman 🎉</div>'}</div>
 <div class="card pad"><h3>Sisa hari stok</h3><small style="display:block;margin-bottom:4px">Estimasi stok habis dalam berapa hari (maks. 30)</small>${[...R].sort((x,y)=>cv(x)-cv(y)).map(r=>`<div class="hb2"><span>${r.i.e} ${esc(r.i.n)}</span><div class="hbar ${cls[r.status]}" style="width:${r.dm>0?Math.min(30,r.cover)/30*100:0}%"></div><b>${dtxt(r)}</b></div>`).join('')}</div></div>
 <div class="two"><div class="card pad"><h3>Risiko kedaluwarsa</h3>${exp.map(x=>`<div class="li"><div class="th">${x.i.e}</div><div class="n"><b>${esc(x.i.n)}</b><small>Exp ${fd(x.b.exp)} · ${x.dte<0?'sudah lewat':'H-'+x.dte} · sisa ${nf(x.b.rem)} ${esc(x.i.u)}</small></div><div style="text-align:right"><b class="neg">${rp(x.val)}</b><small style="display:block">±${nf(x.risk)} ${esc(x.i.u)} berisiko</small></div></div>`).join('')||'<div class="empty">Tidak ada stok yang diperkirakan kedaluwarsa 🎉</div>'}${exp.length?'<small style="display:block;margin-top:10px">Saran: pakai batch ini lebih dulu (FEFO), jadikan menu spesial/promo, dan kurangi jumlah pesanan berikutnya.</small>':''}</div>
 <div class="card pad"><h3>Pola ramai per hari</h3>${dowOK?`<small style="display:block;margin-bottom:4px">Di atas 1,0× = lebih ramai dari rata-rata. Dipakai menghitung kebutuhan selama lead time.</small>`+[1,2,3,4,5,6,0].map(d=>`<div class="hb2"><span>${DN[d]}</span><div class="hbar ${fw[d]>=1.1?'g':fw[d]<=.9?'y':''}" style="width:${fw[d]/fmx*100}%"></div><b>${fw[d].toFixed(2).replace('.',',')}×</b></div>`).join(''):'<div class="empty">Butuh ≥ 14 hari data dengan tiap hari muncul minimal 2×</div>'}</div></div>
 <div class="card pad"><h3>Analisis menu</h3>${mn.length>=2?`<small style="display:block;margin-bottom:10px">Laris = ≥ 70% dari porsi rata-rata penjualan. Margin = laba bahan per porsi (rata-rata ${rp(aCM)}).</small><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px">${quad.map(q=>{const ms=mn.filter(q[3]).sort((x,y)=>y.q-x.q);return `<div style="border:1px solid var(--line);border-radius:12px;padding:12px"><b>${q[0]}</b> <small>· ${q[1]}</small><small style="display:block;margin:2px 0 6px">${q[2]}</small>${ms.map(m=>`<div class="li" style="padding:6px 0"><div class="n">${mName(m.id)}</div><small>${m.q} porsi · ${rp(m.cm)}</small></div>`).join('')||'<small>–</small>'}</div>`}).join('')}</div>`:'<div class="empty">Belum cukup data penjualan</div>'}</div>
 <details class="card pad det" ${S.anaOpen?'open':''} ontoggle="S.anaOpen=this.open"><summary>Pengaturan &amp; detail teknis</summary>
 <h3 style="margin-top:14px">Parameter</h3><div class="pr2"><label class="f" style="margin:0">Biaya pesan per PO (Rp)<input class="fi" type="number" value="${AN.S0}" onchange="DB.set.orderCost=+this.value||0;save();render()"></label><label class="f" style="margin:0">Biaya simpan (% harga / tahun)<input class="fi" type="number" value="${AN.h0*100}" onchange="DB.set.holdPct=+this.value||0;save();render()"></label></div>
 <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px">${['A','B','C'].map(c=>`<label class="f" style="margin:0">Service level kelas ${c}${sel(slOf(c),[[90,'90%'],[95,'95%'],[99,'99%']],`setSL('${c}',this.value)`).replace('<select','<select class="fi"')}</label>`).join('')}</div>
 <small style="display:block;margin-top:6px">Kelas A = bahan bernilai pakai terbesar (80% pertama), B = 15% berikutnya, C = sisanya. Umur simpan bahan bisa diisi di detail bahan (Inventory).</small>
 <h3 style="margin-top:14px">Analisis ABC (nilai pemakaian per tahun)</h3>${tb(['Bahan','Kelas','Nilai pakai/tahun','Kontribusi','Kumulatif'],[...R].sort((x,y)=>y.val-x.val).map(r=>[esc(r.i.n)+(r.est?' *':''),'<b>'+r.cls+'</b>',rp(r.val),nf(r.share)+'%',nf(r.cum)+'%']))}
 <h3 style="margin-top:14px">Reorder point, safety stock &amp; EOQ</h3>${tb(['Bahan','Kelas','Pakai/hari (±σ)','Lead time','Service level','Safety stock','ROP','Stok + incoming','Umur simpan','Saran pesan','Status'],list.map(r=>{const u=esc(r.i.u);return [esc(r.i.n)+(r.est?' *':''),r.cls,`${nf(r.dm)} ±${nf(r.sd)} ${u}`,r.L+' hari',r.sl+'%',nf(r.ss)+' '+u,nf(r.rop)+' '+u,nf(r.pos)+' '+u,r.shelf?r.shelf+' hari':'–',r.q+' '+esc(r.i.buy),`<span class="badge ${pill[r.status][0]}">${pill[r.status][1]}</span>`]})) }
 <small style="display:block;line-height:1.7;margin-top:12px">Pemakaian = penjualan × resep (ukuran &amp; extra shot) + waste + selisih opname negatif, disesuaikan pola per hari. Safety stock = z × σ harian × √L · ROP = kebutuhan selama lead time + safety stock · EOQ = √(2·D·S / (h·c)). Saran pesan = maks(EOQ, kekurangan sampai ROP), lalu dibatasi agar habis terpakai ±90% umur simpan. Status memakai stok + incoming PO. * = estimasi karena belum ada data penjualan.</small></details>`}
function pageSet(){return `<div class="head"><h1>Pengaturan</h1></div><div class="card form"><label class="f" style="margin-top:0">Nama outlet<input class="fi" value="${esc(DB.set.outlet||'Kopi Kita')}" onchange="DB.set.outlet=this.value;save();render()"></label><label class="f">Service charge (%, sudah termasuk di harga menu)<input class="fi" type="number" value="${DB.set.service}" onchange="DB.set.service=+this.value||0;save()"></label><label class="f">PB1 (%, sudah termasuk di harga menu)<input class="fi" type="number" value="${DB.set.pb1}" onchange="DB.set.pb1=+this.value||0;save()"></label>
 <label class="f">Pengguna</label>${(S.users||[]).map(x=>`<div class="li"><div class="n"><b>${esc(x.n)}</b><small>@${esc(x.u)} · ${x.role}${x.act===false?' · nonaktif':''}</small></div><button class="btn sm" onclick="userModal('${x.u}')">Ubah</button></div>`).join('')}<button class="btn sm" style="margin-top:8px" onclick="userModal()">+ Pengguna</button><small style="display:block;margin-top:6px">Admin: semua modul. Staff: kasir, inventory, penerimaan, opname, waste, supplier.</small><label class="f">Metode bayar</label><small>Tunai, QRIS, Debit/Kredit</small>
 <button class="btn" style="width:100%;margin-top:18px;color:var(--red)" onclick="resetModal()">Reset data contoh</button></div>`}
function resetModal(){modal(`<h2>Reset data?<button onclick="closeModal()">×</button></h2><p style="margin-bottom:14px">Semua data kembali ke contoh awal. Tidak bisa dibatalkan.</p><button class="btn p" style="width:100%;background:var(--red);border-color:var(--red)" onclick="resetAll()">Ya, reset</button>`)}
async function resetAll(){await api('/api/reset',{method:'POST'});DB=null;await loadState();closeModal();S.cart=[];render();toast('Data direset')}

/* ---------- render ---------- */
function render(){
 _AN=null;if(!S.user)return;if(!allowed(S.page))S.page=first();renderSide();$('#outlet').textContent=DB.set.outlet||'Kopi Kita';
 $('#view').innerHTML=({dash:pageDash,inv:pageInv,pos:pagePos,rec:pageRec,buy:pageBuy,opn:pageOpn,wst:pageWst,sup:pageSup,rep:pageRep,ana:pageAna,set:pageSet})[S.page]();
 if(S.page==='inv')invTable();if(S.page==='pos'){menuGrid();renderCart()}if(S.page==='set'&&!S.users)loadUsers().then(render);const sel=document.querySelector('select[onchange*=quickSwitch]');if(sel)sel.value=S.role;$('#demo').style.display=S.user.base==='Admin'?'flex':'none'}
$('#bell').innerHTML=ic('bell')+'<span class="dot"></span>';$('#burger').innerHTML=ic('menu');
$('#bell').onclick=()=>{const c=counts(),e=DB.bat.filter(b=>b.rem>0&&b.exp&&daysTo(b.exp)<=3).length;toast(`${c.low+c.out} bahan perlu perhatian · ${e} batch ≤ H-3 kedaluwarsa`)};
$('#burger').onclick=()=>{$('#side').classList.add('open');$('#scrim').classList.add('on')};
$('#scrim').onclick=()=>{$('#side').classList.remove('open');$('#scrim').classList.remove('on')};
(async()=>{try{const r=await api('/api/me');if(r.ok){await enter(await r.json());return}}catch(e){}$('#login').classList.add('on')})();
</script></body></html>
